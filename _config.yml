        quote: >
          알고리즘 문제 풀이와 온라인 채점을 제공하는 서비스
        description: |
          - **검색 성능 개선:** 30만 건 데이터의 검색 쿼리를 인덱스로 최적화해 p95 지연 시간을 32.75ms에서 1.82ms로 약 94% 단축
          - **채점 작업 분산:** Redis 메시지 큐로 Spring Boot API 서버와 실행 워커를 분리하고, 여러 워커 인스턴스에 채점 작업 분산
          - **실행 환경 격리:** 제출 코드를 Docker 컨테이너에서 실행하고 네트워크 차단, 테스트케이스별 1~2초 시간 제한 및 128~256MB 메모리 제한으로 무한 루프와 호스트 자원 고갈 방지

          **Tech Stack:** Java, Spring Boot, PostgreSQL, Redis, Docker, AWS EC2

