        caption: "2026.07 ~ 현재 · 팀 프로젝트(5인)"
        link: "https://bokduckbang.com"
        quote: >
          지도에서 공공임대주택 단지와 모집 공고를 확인하는 서비스
        description: |
          - **배포 자동화:** SSH 접근이 제한된 환경에서 GitHub Actions와 self-hosted runner 기반 CI/CD를 구축해 수동 배포 제거 및 배포 오류 예방
          - **운영 가시성 확보:** Prometheus·Grafana·Alloy·Loki로 지표와 로그를 통합해 SSH 접속 없이 운영 상태 확인 및 장애 원인 분석
          - **장애 대응:** 지연 시간 급증과 HTTP 5xx 오류에 대한 Discord 실시간 알림을 구성하고, traceId로 요청과 로그를 연계해 운영 병목 분석·해결

          **Tech Stack:** AWS EC2, Docker, PostgreSQL, GitHub Actions, Prometheus, Grafana, Loki

      - layout: left
        title: 알고리즘 채점 플랫폼
        sub_title: 백엔드·채점 워커 개발, 인프라 구축·운영
        caption: "2026.06 ~ 2026.07 · 개인 프로젝트"
        # link: "https://algorithm.zzanggyu.com"
        additional_links:
