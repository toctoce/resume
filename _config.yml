about_content: |
  개발과 운영 경험을 갖춘 백엔드 개발자 박영규입니다.

  개인 알고리즘 채점 플랫폼의 백엔드를 Java와 Spring Boot로 개발하고, 직접 배포하며 서비스 운영에 관심을 넓혔습니다.

  이후 공공주택 서비스 팀 프로젝트에서 인프라 구축과 운영을 담당하며, CI/CD 기반 배포 자동화와 모니터링 시스템을 구축했습니다.

